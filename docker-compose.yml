services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: flotte-api

    ports:
      - "3000:3000"

    env_file:
      - .env

    depends_on:
      - mongodb

    volumes:
      - .:/usr/src/app

    command: npm run dev

    networks:
      - flotte-network

  mongodb:
    image: mongo:latest

    container_name: flotte-mongodb

    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: flotte

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

    networks:
      - flotte-network

  minio:
    image: ghcr.io/librefs/librefs:latest
    container_name: flotte-minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    networks:
      - flotte-network

networks:
  flotte-network:
    driver: bridge

volumes:
  mongodb_data:
  minio_data:
